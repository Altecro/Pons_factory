<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="CATDOG mark">

  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ef0ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#021018"/>
  <g filter="url(#glow)" transform="translate(64 64)">
    <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.7" transform="rotate(-25)"/>
    <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="#3ef0ff" stroke-width="3" opacity="0.9" transform="rotate(35)"/>
    <circle cx="0" cy="0" r="16" fill="url(#g)"/>
    <circle cx="28" cy="-18" r="6" fill="#3ef0ff"/>
  </g>
</svg>
